[project]
name = "tft-goat"
version = "0.2.0"
description = "IA pour jouer a Teamfight Tactics par reinforcement learning / self-play"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "riotwatcher>=3.3",
    "numpy>=1.26",
    "gymnasium>=0.29",
    "pettingzoo>=1.24",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tft_goat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
